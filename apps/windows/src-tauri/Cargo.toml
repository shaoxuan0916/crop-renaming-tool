[package]
name = "crop-renamer-windows"
version = "0.1.0"
description = "Windows desktop app for crop renaming workflows"
authors = ["shaoxuan"]
edition = "2021"

[lib]
name = "crop_renamer_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4", "serde"] }
